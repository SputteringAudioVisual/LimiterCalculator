name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean "Build files/main.spec"

      - name: Package portable download
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\*" -DestinationPath "LimiterCalculator-Windows.zip"
          $hash = (Get-FileHash "dist\LimiterCalculator.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  LimiterCalculator.exe" | Set-Content "dist\SHA256SUMS.txt"

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist\LimiterCalculator.exe" `
            "LimiterCalculator-Windows.zip" `
            "dist\SHA256SUMS.txt" `
            --verify-tag `
            --generate-notes `
            --title "Limiter Calculator ${{ github.ref_name }}"
